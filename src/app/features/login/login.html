<div class="container">
  <form [formGroup]="userForm">
    <div class="mb-3">
      <label for="email" class="form-label">Email:</label>
      <input type="text" class="form-control" id="email" formControlName="email" />
    </div>
    @if (emailControl.touched) {
      @if (emailControl.hasError('required')) {
        <app-error-msg [errorMsg]="'Email is required'" />
      }
      @if (emailControl.hasError('email')) {
        <app-error-msg [errorMsg]="'Wrong Format'" />
      }
      @if (emailControl.hasError('minlength')) {
        <app-error-msg [errorMsg]="'Minlength is 10 symbol'" />
      }
    }
    <div class="mb-3">
      <label for="password" class="form-label">Password: </label>
      <input type="password" class="form-control" id="password" formControlName="password" />
    </div>

    @if (passwordControl.touched) {
      @if (passwordControl.hasError('required')) {
        <app-error-msg [errorMsg]="'Password is required'" />
      }
      @if (passwordControl.hasError('pattern')) {
        <app-error-msg [errorMsg]="'Password must be min 8 symbol, min 1 big letter ...'" />
      }
    }
  </form>

  <button [disabled]="userForm.invalid" type="submit" class="btn-solid theme-primary">Login</button>
  <button routerLink="/register" type="submit" class="btn-solid theme-secondary">Register</button>
</div>
