<section
  [routerLink]="['/product-description', productServ.activatedCategory(), product().id]"
  class="card"
  style="max-width: 320px; cursor: pointer"
>
  @if (cartServ.isAdded(product())) {
    <i (click)="deleteFromCart($event)" class="fa-solid fa-trash fa-2xl"></i>
  }
  <img src="laptop.png" class="card-img-top" alt="..." />
  <div class="card-body">
    <h4 class="card-title">{{ product().name }}</h4>
    <p class="card-text">
      {{ product().price }}
    </p>
    <a (click)="addToCart($event)" class="btn-solid theme-primary">Add to Cart</a>
  </div>
</section>
